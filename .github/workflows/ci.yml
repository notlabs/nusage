name: ci

# Pull requests check affected projects; main checks all projects before release assembly.
# Main supplies the shared build cache, while same-repository PR revisions can also reuse
# their own scoped cache. Both platform checks remain required.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # A check the environment cannot run is a failure, not a skip.
  CI: "true"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      # A push to main writes to the cache server as itself, by OIDC; GitHub withholds
      # the token from forks' pull requests, and the server grants writes to main alone.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Native affected-project selection needs the merge base, including on restacks.
          fetch-depth: 0
          persist-credentials: false
      # Also exports mise.toml's `[env]`, the cache server's `MBX_REMOTE_*` among it.
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.21
      # mise.toml names the server twice, for mise and for mbx; the two must agree. Anyone
      # reads it; a push to main also writes, mbx's builds and mise's task results.
      - if: env.MBX_REMOTE_URL != ''
        run: |
          if [ "$(mise settings get task.cache.remote_url 2>/dev/null)" != "$MBX_REMOTE_URL" ]; then
            echo "::error file=mise.toml::task.cache.remote_url and MBX_REMOTE_URL name different servers"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            echo "MBX_REMOTE_OIDC_AUDIENCE=$MBX_REMOTE_URL" >> "$GITHUB_ENV"
            echo "MISE_TASK_CACHE_REMOTE_OIDC_AUDIENCE=$MBX_REMOTE_URL" >> "$GITHUB_ENV"
          fi
      # Mr Boxington's store from the cache server mise.toml names, keeping the
      # `MBX_REMOTE_*` exported above.
      - if: env.MBX_REMOTE_URL != ''
        uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1.7.3
        with:
          backend: remote
      # Without a server, Mr Boxington's store, which every Cargo workspace here shares,
      # from the Actions cache; the mbx mise installed is the one on PATH. The store is
      # kept apart under the runner's temporary directory, and the target directory goes
      # before the store is exported: a hosted runner's disk holds the debug build or the
      # export, not both.
      - if: env.MBX_REMOTE_URL == ''
        uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1.7.3
        with:
          github-cache-mode: objects
          isolate-objects-cache: true
          # Revisions of a same-repository PR can reuse their scoped build cache.
          save-on-pull-request: true
          clean-target-before-export: true
      # rustc's and clippy's findings as annotations, through mise's task prefix.
      - run: echo "::add-matcher::.github/matchers/rust.json"
      # Check Mergiraf when its implementation, runner or toolchain changes. Main also
      # applies every patch as part of its full check, even when semantic cases are unchanged.
      - id: mergiraf-changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            # Checkout leaves no credential behind; supply its read-only token for this fetch.
            git -c credential.helper= -c 'credential.helper=!gh auth git-credential' fetch --no-tags --depth=1 origin "$BASE_SHA"
            echo "base=$BASE_SHA" >> "$GITHUB_OUTPUT"
            if git diff --quiet "$BASE_SHA" HEAD -- mergiraf jj.toml mise.toml mise.lock .mise/lib/actions.nu .github/workflows/ci.yml; then
              echo "run=false" >> "$GITHUB_OUTPUT"
            else
              echo "run=true" >> "$GITHUB_OUTPUT"
            fi
          fi
      # Formatting, workflow lint and documentation run once on Linux. Both platforms
      # retain Rust tests, Clippy and the runtime/consumer checks.
      - name: Check repository
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ -n "$AFFECTED_BASE" ]; then
            # Root formatting and selection-regression checks cover the whole repository.
            if [ "$RUNNER_OS" = Linux ]; then
              mise run //:check
            fi
            mise run --affected --affected-base "$AFFECTED_BASE" --affected-head HEAD --affected-committed "$NUS_CHECK_TASK"
          else
            # Main is the full validation boundary used by release assembly.
            mise run "$NUS_CHECK_TASK"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          AFFECTED_BASE: ${{ steps.mergiraf-changes.outputs.base }}
          NUS_CHECK_TASK: ${{ runner.os == 'Linux' && '//...:check' || '//...:check:platform' }}
      - if: steps.mergiraf-changes.outputs.run == 'true'
        run: mise run //mergiraf:test
