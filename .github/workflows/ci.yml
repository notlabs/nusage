name: ci

# The checks on every pull request, and on main, where the run fills the build cache that
# pull requests read. Releasing waits on no check of its own: main takes a pull request only
# with this check green.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # A check the environment cannot run is a failure, not a skip.
  CI: "true"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.21
      # Mr Boxington's store, which every Cargo workspace here shares, from the Actions
      # cache; the mbx mise installed is the one on PATH. The store is kept apart under
      # the runner's temporary directory, and the target directory goes before the store
      # is exported: a hosted runner's disk holds the debug build or the export, not both.
      - uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1.7.3
        with:
          github-cache-mode: objects
          isolate-objects-cache: true
          clean-target-before-export: true
      # rustc's and clippy's findings as annotations, through mise's task prefix.
      - run: echo "::add-matcher::.github/matchers/rust.json"
      # The catalog's gh checks read this repository through gh; the workflow's token reads
      # and nothing more.
      - run: mise run '//...:check'
        env:
          GH_TOKEN: ${{ github.token }}
      # Patch application is checked on every run; build and exercise the semantic cases
      # when their implementation, runner or toolchain changes.
      - id: mergiraf-changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            # Checkout leaves no credential behind; supply its read-only token for this fetch.
            git -c credential.helper= -c 'credential.helper=!gh auth git-credential' fetch --no-tags --depth=1 origin "$BASE_SHA"
            if git diff --quiet "$BASE_SHA" HEAD -- mergiraf jj.toml mise.toml mise.lock .mise/lib/actions.nu .github/workflows/ci.yml; then
              echo "run=false" >> "$GITHUB_OUTPUT"
            else
              echo "run=true" >> "$GITHUB_OUTPUT"
            fi
          fi
      - if: steps.mergiraf-changes.outputs.run == 'true'
        run: mise run //mergiraf:test
