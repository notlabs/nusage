name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # A check the environment cannot run is a failure, not a skip.
  CI: "true"
  # Tools come from the lockfiles only; nothing is resolved or auto-locked on the runner.
  MISE_LOCKED: "true"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # Keep managed target links inside the discovery boundary; the object store remains shared.
  MBX_TARGET_ROOT: ${{ github.workspace }}/.cache/mbx-targets

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Native affected-project selection needs the merge base, including on restacks.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-mise
      # The acceptance harness creates isolated JJ workspaces from this checkout.
      # Reused local job containers already hold the repository.
      - run: test -d .jj || jj git init --colocate
      # mise's task results, under the runner's temporary directory, from the Actions cache
      # as main last saved them.
      - run: echo "MISE_TASK_CACHE_DIR=$RUNNER_TEMP/mise-task-cache" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.MISE_TASK_CACHE_DIR }}
          key: mise-tasks-${{ runner.os }}-${{ github.sha }}
          restore-keys: mise-tasks-${{ runner.os }}-
      # Mr Boxington's store, which every Cargo workspace here shares, from the Actions
      # cache; the mbx mise installed is the one on PATH. The target directory goes before
      # the store is exported: a hosted runner's disk holds the debug build or the export,
      # not both.
      - uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1.7.3
        with:
          github-cache-mode: objects
          isolate-objects-cache: true
          # Revisions of a same-repository PR can reuse their scoped build cache.
          save-on-pull-request: true
          clean-target-before-export: true
      - name: Install local binaries
        run: mise run --timings //:build
      # rustc's and clippy's findings as annotations, through mise's task prefix.
      - run: echo "::add-matcher::.github/matchers/rust.json"
      # The base a pull request's affected projects are selected against, and whether Mergiraf's
      # merge cases run: when its implementation, runner or toolchain changed.
      - id: mergiraf-changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            # Checkout leaves no credential behind; supply its read-only token for this fetch.
            git -c credential.helper= -c 'credential.helper=!gh auth git-credential' fetch --no-tags --depth=1 origin "$BASE_SHA"
            echo "base=$BASE_SHA" >> "$GITHUB_OUTPUT"
            if git diff --quiet "$BASE_SHA" HEAD -- mergiraf jj.toml mise.toml mise.lock .mise/conf.d actions/mod.nu .github/workflows/ci.yml; then
              echo "run=false" >> "$GITHUB_OUTPUT"
            else
              echo "run=true" >> "$GITHUB_OUTPUT"
            fi
          fi
      # Run each project's checks on Linux.
      - name: Check repository
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ -n "$AFFECTED_BASE" ]; then
            # The root's checks hold the whole repository, whatever the change.
            mise run --timings //:check
            mise run --timings --affected --affected-base "$AFFECTED_BASE" --affected-head HEAD --affected-committed "$NUS_CHECK_TASK"
          else
            # Main is the full validation boundary used by release assembly.
            mise run --timings "$NUS_CHECK_TASK"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          AFFECTED_BASE: ${{ steps.mergiraf-changes.outputs.base }}
          NUS_CHECK_TASK: "//...:check"
      - if: steps.mergiraf-changes.outputs.run == 'true'
        run: mise run --timings //mergiraf:test
      # A push to main saves mise's task results for later runs. mise stores a task's
      # result only when it succeeded.
      - if: ${{ !cancelled() && github.event_name == 'push' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.MISE_TASK_CACHE_DIR }}
          key: mise-tasks-${{ runner.os }}-${{ github.sha }}
