name: release-plz

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-plz

jobs:
  # Opens or updates the release pull request with the version bump and changelog; merging
  # it tags the version and creates its draft GitHub release. The token has to be a personal
  # access token or an app token: a pull request and a tag made with the workflow's own
  # token run no workflows, so neither the checks nor the binaries would follow.
  release-plz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    env:
      GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
    steps:
      - name: Require the release token
        run: |
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "::error::RELEASE_PLZ_TOKEN is not set; see .github/workflows/release-plz.yml"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - uses: jdx/mise-action@v5
        with:
          version: 2026.10.21
      - uses: release-plz/action@v0.5
        with:
          command: release
      - uses: release-plz/action@v0.5
        with:
          command: release-pr
