name: release

# After CI succeeds for a main commit, that exact commit is released: nusage's version or a
# prerelease of it, the task catalog's version, and each catalog package's, each when it has
# no release yet. Validation is CI's, so nothing here repeats it, and what is published is
# built from the checkout alone, with no cache. The workflow's own token is enough: a tag it
# pushes runs no other workflow.
on:
  # Jobs accept only successful same-repository pushes whose checked SHA is still main's
  # event SHA, matching the attestation's OIDC source. Superseded completions are skipped.
  # No artifact from the triggering workflow is consumed.
  # jactionlint ignore=dangerous-triggers
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: release

env:
  MBX_DISABLE: "1"
  MISE_TASK_CACHE: "off"

jobs:
  tag:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_sha == github.sha &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      # release-plz reads the pull requests behind the commits, for the release notes.
      pull-requests: read
    outputs:
      tag: ${{ steps.released.outputs.tag }}
    steps:
      # release-plz pushes the tag with git, so the checkout keeps its credentials.
      # jactionlint ignore=artipacked
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.21
      - uses: release-plz/action@f67a7e724bdad4a0f6875f186060a0ca2770d76c # v0.5.147
        id: release-plz
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: released
        env:
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          tag=$(jq -r '.[] | select(.package_name == "nusage") | .tag' <<< "${RELEASES:-[]}")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # What this checked commit releases, and the targets built for it: the tag release-plz made,
  # or else a prerelease of the commit, tagged here with a draft release for its binaries. A
  # commit that is itself the last release's has nothing to prerelease.
  plan:
    needs: tag
    if: ${{ !cancelled() && needs.tag.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      # A prerelease's tag is pushed with git, so the checkout keeps its credentials.
      # jactionlint ignore=artipacked
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
      - id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASED_TAG: ${{ needs.tag.outputs.tag }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          # Releases and prereleases alike; another platform is another row.
          TARGETS: |
            [
              {"target": "x86_64-unknown-linux-gnu", "os": "ubuntu-latest", "build-tool": "cargo"}
            ]
        run: |
          if [ -n "$RELEASED_TAG" ]; then
            tag=$RELEASED_TAG
            prerelease=false
          else
            last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude 'v*-*' "$SHA")
            count=$(git rev-list --count "$last..$SHA")
            if [ "$count" = 0 ]; then
              echo "$SHA is $last, so there is nothing to prerelease"
              exit 0
            fi
            IFS=. read -r major minor patch <<< "${last#v}"
            tag="v$major.$minor.$((patch + 1))-dev.$count"
            prerelease=true
            # A rerun finds the tag and the release it made before, and builds again.
            if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              git tag "$tag" "$SHA"
              git push origin "refs/tags/$tag"
            fi
            if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --prerelease \
                --title "${tag#v}" --notes "A prerelease of $SHA, $count commits after $last."
            fi
          fi
          {
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "prerelease=$prerelease"
            echo "matrix=$(jq -c . <<< "$TARGETS")"
          } >> "$GITHUB_OUTPUT"

  assets:
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.tag != '' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.plan.outputs.tag }}
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.21
          cache: false
      # A prerelease's version is set in this checkout alone, so the binary reports it.
      - if: needs.plan.outputs.prerelease == 'true'
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: release-plz set-version "$VERSION"
      - run: rustup target add ${{ matrix.target }}
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        if: matrix.build-tool == 'cross'
        with:
          tool: cross
      - uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        id: upload
        with:
          bin: nus
          target: ${{ matrix.target }}
          build-tool: ${{ matrix.build-tool }}
          archive: $bin-$tag-$target
          checksum: sha256
          locked: true
          ref: refs/tags/${{ needs.plan.outputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}
      # Attestations for a private repository need GitHub Enterprise Cloud.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: ${{ steps.upload.outputs.tar || steps.upload.outputs.zip }}

  publish:
    needs: [plan, assets]
    if: ${{ !cancelled() && needs.assets.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

  # Pack versioned entries and prepare new or incomplete releases for signing.
  packages:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_sha == github.sha &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      released: ${{ steps.release.outputs.released }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.21
          cache: false
      - run: mise install --monorepo --locked
      - run: mise run //catalog:pack
      - id: release
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          mise exec -- nu catalog/tasks/release.nu catalog/dist/packages/packages.json \
            --repo "$GITHUB_REPOSITORY" --commit "$SOURCE_SHA"

  # Sign each released package. This job reads the release and cannot change it.
  package-sign:
    needs: packages
    if: ${{ !cancelled() && needs.packages.result == 'success' && needs.packages.outputs.released != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.packages.outputs.released) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: jdx/packslip@44e50e5f64551234b4a382d991bd7f7f7d021d06 # v1.11.3
        id: packslip
        with:
          download: ${{ matrix.asset }}
          project: github.com/${{ github.repository }}/catalog/${{ matrix.name }}
          version: ${{ matrix.version }}
          tag: ${{ matrix.tag }}
          commit: ${{ matrix.commit }}
          # Recover older archives without claiming the current revision built them.
          attest: ${{ matrix.commit == github.event.workflow_run.head_sha && 'true' || 'false' }}
          upload: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packslip-${{ matrix.name }}
          path: ${{ steps.packslip.outputs.bundle }}
          if-no-files-found: error

  # Attach each signed bundle to its release.
  package-bundles:
    needs: [packages, package-sign]
    if: ${{ !cancelled() && needs.package-sign.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.packages.outputs.released) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packslip-${{ matrix.name }}
          path: packslip
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ matrix.tag }}
          BUNDLE: packslip/packslip.catalog-${{ matrix.name }}.sigstore.json
        run: |
          test -f "$BUNDLE"
          gh release upload "$TAG" "$BUNDLE" --repo "$GITHUB_REPOSITORY" --clobber

  # The task catalog, pushed to GHCR as `ghcr.io/<repository>-tasks:<version>` and tagged
  # `catalog/v<version>`.
  catalog:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_sha == github.sha &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      # Read the version with mise alone; an already released catalog installs no tools.
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.21
          install: false
          cache: false
      # The version catalog/mise.toml declares, and whether it is released already.
      - id: version
        run: |
          version=$(mise config get vars.catalog_version --file catalog/mise.toml)
          tag="catalog/v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            released=true
          else
            released=false
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "released=$released"
          } >> "$GITHUB_OUTPUT"
      - if: steps.version.outputs.released == 'false'
        run: mise install --monorepo --locked
      - if: steps.version.outputs.released == 'false'
        run: mise run //catalog:assemble
      - if: steps.version.outputs.released == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd catalog/dist/oci
          echo "$GH_TOKEN" | mise x aqua:oras-project/oras@1.3.4 -- oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          mise x aqua:oras-project/oras@1.3.4 -- oras push "ghcr.io/${GITHUB_REPOSITORY}-tasks:${VERSION}" catalog
      - if: steps.version.outputs.released == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "catalog $VERSION" \
            --notes "The catalog's tasks, as the OCI task catalog \`oci::ghcr.io/$GITHUB_REPOSITORY-tasks:$VERSION\`; the modules are released as packages of their own, under \`catalog/<tool>/v<version>\`."
