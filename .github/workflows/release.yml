name: release

# The binaries for the release release-plz created for the tag, one archive per target with
# its checksum, each attested; what mise's `github:` backend installs.
on:
  push:
    tags: ["v[0-9]+.*"]

permissions:
  contents: read

jobs:
  assets:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, build-tool: cargo }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, build-tool: cross }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-latest, build-tool: cross }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, build-tool: cross }
          - { target: x86_64-apple-darwin, os: macos-latest, build-tool: cargo }
          - { target: aarch64-apple-darwin, os: macos-latest, build-tool: cargo }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, build-tool: cargo }
          - { target: aarch64-pc-windows-msvc, os: windows-latest, build-tool: cargo }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@cross
        if: matrix.build-tool == 'cross'
      - uses: taiki-e/upload-rust-binary-action@v1
        id: upload
        with:
          bin: nusage
          target: ${{ matrix.target }}
          build-tool: ${{ matrix.build-tool }}
          archive: $bin-$tag-$target
          checksum: sha256
          locked: true
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.upload.outputs.tar || steps.upload.outputs.zip }}
