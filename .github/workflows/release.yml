name: release

# After CI succeeds for the current main commit, release-plz tags the version Cargo.toml
# declares at that exact checked commit when no tag exists. Its Linux binary is attached and the
# draft release published. The version and changelog are committed beforehand
# (`mise run release`); validation is CI's, so release assembly need not repeat it.
# The workflow's own token is enough: a tag it pushes runs no other workflow.
#
# The other targets are built on demand: run this workflow with the tag and the targets,
# `all` or a comma-separated list, and they are attached to that release.
#
# The catalog's tasks release apart, by the same rule: a checked main commit whose
# `catalog_version` has no release yet pushes the tasks `//catalog:assemble` writes to GHCR
# as the OCI task catalog `ghcr.io/<repository>-tasks:<version>`, and is tagged
# `catalog/v<version>`.
#
# Each catalog entry with a `version` is a package of its own, the packslip project
# `github.com/<repository>/catalog/<tool>`: publish the archive `//catalog:pack` writes and
# sign it with this workflow's identity, by a job that cannot change the release. Retry
# releases missing an archive or bundle, preserving any archive already uploaded.
on:
  # Jobs accept only successful same-repository pushes whose checked SHA is still main's
  # event SHA, matching the attestation's OIDC source. Superseded completions are skipped.
  # No artifact from the triggering workflow is consumed.
  # jactionlint ignore=dangerous-triggers
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: The release to attach binaries to, such as v0.1.1
        required: true
        type: string
      targets:
        description: The targets to build, `all` or comma-separated
        required: true
        default: all
        type: string

permissions: {}

concurrency:
  group: release

jobs:
  tag:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_sha == github.sha &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      # release-plz reads the pull requests behind the commits, for the release notes.
      pull-requests: read
    outputs:
      tag: ${{ steps.released.outputs.tag }}
    steps:
      # release-plz pushes the tag with git, so the checkout keeps its credentials.
      # jactionlint ignore=artipacked
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.21
      - uses: release-plz/action@f67a7e724bdad4a0f6875f186060a0ca2770d76c # v0.5.147
        id: release-plz
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: released
        env:
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          tag=$(jq -r '.[] | select(.package_name == "nusage") | .tag' <<< "${RELEASES:-[]}")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # The tag and the targets: after CI, the tag release-plz made and Linux x86_64; on a
  # dispatch, the given tag and targets.
  plan:
    needs: tag
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.tag.outputs.tag != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          RELEASED_TAG: ${{ needs.tag.outputs.tag }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_TARGETS: ${{ inputs.targets }}
          ALL: |
            [
              {"target": "x86_64-unknown-linux-gnu", "os": "ubuntu-latest", "build-tool": "cargo"},
              {"target": "x86_64-unknown-linux-musl", "os": "ubuntu-latest", "build-tool": "cross"},
              {"target": "aarch64-unknown-linux-gnu", "os": "ubuntu-24.04-arm", "build-tool": "cargo"},
              {"target": "aarch64-unknown-linux-musl", "os": "ubuntu-24.04-arm", "build-tool": "cross"},
              {"target": "x86_64-apple-darwin", "os": "macos-latest", "build-tool": "cargo"},
              {"target": "aarch64-apple-darwin", "os": "macos-latest", "build-tool": "cargo"},
              {"target": "x86_64-pc-windows-msvc", "os": "windows-latest", "build-tool": "cargo"},
              {"target": "aarch64-pc-windows-msvc", "os": "windows-latest", "build-tool": "cargo"}
            ]
        run: |
          if [ "$EVENT" = workflow_run ]; then
            tag=$RELEASED_TAG
            targets=x86_64-unknown-linux-gnu
          else
            tag=$INPUT_TAG
            targets=$INPUT_TARGETS
          fi
          if [ "$targets" = all ]; then
            matrix=$(jq -c '.' <<< "$ALL")
          else
            matrix=$(jq -c --arg targets "$targets" \
              '[.[] | select(.target as $t | ($targets | split(",") | map(gsub("\\s"; "")) | index($t)) != null)]' \
              <<< "$ALL")
          fi
          if [ "$(jq 'length' <<< "$matrix")" = 0 ]; then
            echo "::error::no target in '$targets' is known"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  assets:
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.plan.outputs.tag }}
          persist-credentials: false
      # No cache: what is published is built from the checkout alone.
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.21
          cache: false
        env:
          MBX_DISABLE: "1"
      - run: rustup target add ${{ matrix.target }}
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        if: matrix.build-tool == 'cross'
        with:
          tool: cross
      - uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        id: upload
        with:
          bin: nus
          target: ${{ matrix.target }}
          build-tool: ${{ matrix.build-tool }}
          archive: $bin-$tag-$target
          checksum: sha256
          locked: true
          ref: refs/tags/${{ needs.plan.outputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          MBX_DISABLE: "1"
      # Attestations for a private repository need GitHub Enterprise Cloud.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: ${{ steps.upload.outputs.tar || steps.upload.outputs.zip }}

  publish:
    needs: [plan, assets]
    if: ${{ !cancelled() && needs.assets.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

  # Pack versioned entries and prepare new or incomplete releases for signing.
  packages:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_sha == github.sha &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MBX_DISABLE: "1"
    outputs:
      released: ${{ steps.release.outputs.released }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      # Published packages are built from the checkout alone.
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.21
          cache: false
      - run: mise install --monorepo --locked
      - run: mise run //catalog:pack
      - id: release
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          mise exec -- nu catalog/tasks/release.nu catalog/dist/packages/packages.json \
            --repo "$GITHUB_REPOSITORY" --commit "$SOURCE_SHA"

  # Sign each released package. This job reads the release and cannot change it.
  package-sign:
    needs: packages
    if: ${{ !cancelled() && needs.packages.result == 'success' && needs.packages.outputs.released != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.packages.outputs.released) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: jdx/packslip@44e50e5f64551234b4a382d991bd7f7f7d021d06 # v1.11.3
        id: packslip
        with:
          download: ${{ matrix.asset }}
          project: github.com/${{ github.repository }}/catalog/${{ matrix.name }}
          version: ${{ matrix.version }}
          tag: ${{ matrix.tag }}
          commit: ${{ matrix.commit }}
          # Recover older archives without claiming the current revision built them.
          attest: ${{ matrix.commit == github.event.workflow_run.head_sha && 'true' || 'false' }}
          upload: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packslip-${{ matrix.name }}
          path: ${{ steps.packslip.outputs.bundle }}
          if-no-files-found: error

  # Attach each signed bundle to its release.
  package-bundles:
    needs: [packages, package-sign]
    if: ${{ !cancelled() && needs.package-sign.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.packages.outputs.released) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packslip-${{ matrix.name }}
          path: packslip
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ matrix.tag }}
          BUNDLE: packslip/packslip.catalog-${{ matrix.name }}.sigstore.json
        run: |
          test -f "$BUNDLE"
          gh release upload "$TAG" "$BUNDLE" --repo "$GITHUB_REPOSITORY" --clobber

  catalog:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_sha == github.sha &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MBX_DISABLE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      # Read the version with mise alone; an already released catalog installs no tools.
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.21
          install: false
          cache: false
      # The version catalog/mise.toml declares, and whether it is released already.
      - id: version
        run: |
          version=$(mise config get vars.catalog_version --file catalog/mise.toml)
          tag="catalog/v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            released=true
          else
            released=false
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "released=$released"
          } >> "$GITHUB_OUTPUT"
      # This exact commit passed CI. Build its interpreter and assemble its committed
      # catalog without repeating validation. Published builds still use no cache.
      - if: steps.version.outputs.released == 'false'
        run: mise install --monorepo --locked
      - if: steps.version.outputs.released == 'false'
        run: mise run //catalog:assemble
      - if: steps.version.outputs.released == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd catalog/dist/oci
          echo "$GH_TOKEN" | mise x aqua:oras-project/oras@1.3.4 -- oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          mise x aqua:oras-project/oras@1.3.4 -- oras push "ghcr.io/${GITHUB_REPOSITORY}-tasks:${VERSION}" catalog
      - if: steps.version.outputs.released == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "catalog $VERSION" \
            --notes "The catalog's tasks, as the OCI task catalog \`oci::ghcr.io/$GITHUB_REPOSITORY-tasks:$VERSION\`; the modules are released as packages of their own, under \`catalog/<tool>/v<version>\`."
