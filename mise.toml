min_version = "2026.9.2"
monorepo_root = true

[monorepo]
config_roots = ["nusage", "mise"]

# The Cargo workspace is at the root, so its toolchain is: one pin for Cargo, the tasks and CI.
[tools]
rust = { version = "1.99.1", profile = "minimal", components = ["rustfmt", "clippy"], mr_boxington = true }
mr-boxington = "1.27.0"
nu = "0.116.1"
usage = "7.1.3"
jujutsu = "0.46.0"
actionlint = "1.7.11"

# The repository's tasks run through the nusage built here, which `//nusage:build` links
# into `.bin`, not through a release.
[env]
_.path = ["{{config_root}}/.bin"]

[tasks.lint]
description = "The workflows, by actionlint"
run = "actionlint"

[tasks.check]
description = "The root's own checks"
depends = [":lint"]
