min_version = "2026.10.21"
monorepo_root = true
include = ["share/nusage.toml"]

# The repository root is the project `nu:root`. Its shell autoload loads a file the user's
# Nushell resolves; it names no file here.
[_.nusage.project]
dynamic = ["share/nushell/autoload/nus.nu"]

[settings]
auto_install_disable_tools = ["github:notlabs/nusage"]
experimental = true
env_cache = true
env_cache_ttl = "24h"

[monorepo]
config_roots = ["[!.]*", "[!.]*/[!.]*", "[!.]*/[!.]*/[!.]*"]

# Freshness belongs to the installed binaries' build tasks.
[deps.nus]
auto = true
run = "mise run --no-deps '//crates/...:build'"

[task_config]
includes = [".mise/tasks"]
global_inputs = ["mise.toml"]
# A task that declares what it reads, and what it writes or that it writes nothing, keeps
# its result in mise's task cache.
shell = "nu -c"
# A cached result is also keyed by the variables that change what Cargo builds.
cache = { enabled = true, env = [
  "CARGO_PROFILE_DEV_DEBUG",
  "CARGO_INCREMENTAL",
  "RUSTFLAGS",
] }

[tools]
"github:notlabs/nusage" = "path:{{config_root}}/target/install"
# Infrastructure uses the committed catalog modules with these binaries.
# The mise package records no tool version; min_version above gates CLI support.
gh = "2.103.3"
docker-compose = "5.6.1"
# usage's source, for its argv corpus, which the tests pose to the interpreter's parser.
"http:usage-source" = { version = "7.1.3", url = "https://github.com/jdx/usage/archive/refs/tags/v{% raw %}{{ version }}{% endraw %}.tar.gz", strip_components = 1, bin_path = "corpus" }


[env]
_.nusage-graph = {}
# Keep managed target links inside the discovery boundary; the object store remains shared.
MBX_TARGET_ROOT = "{{config_root}}/.cache/mbx-targets"
# Carry `.miserc.toml`'s exclusions into nested mise invocations: the variable replaces the
# file's list wherever it is set.
MISE_IGNORED_CONFIG_PATHS = "{{env.MBX_TARGET_ROOT}}{% if os() == 'windows' %};{% else %}:{% endif %}{{config_root}}/target"

[tasks.check]
description = "The root's own checks"
depends = [":lint", ":test"]

[tools."http:nutest"]
version = "1.2.0"
url = "https://github.com/vyadh/nutest/releases/download/v1.2.0/nutest-1.2.0.zip"
strip_components = 1
bin_path = "."

[tasks.test]
description = "Run graph and provider Nutest suites"
depends = ["//graph:test"]

# The released nusage for this user: fragments of the global mise config that
# `mise dot apply` links into place.
[dotfiles]
"~/.config/mise/conf.d/nusage.toml" = { source = "share/nusage.toml", mode = "symlink" }
"~/.config/mise/conf.d/nusage/mise.nus-lsp.toml" = { source = "share/nusage/mise.nus-lsp.toml", mode = "symlink" }
"~/.config/mise/conf.d/nusage/mise.nus-kakehashi.toml" = { source = "share/nusage/mise.nus-kakehashi.toml", mode = "symlink" }

# nusage's activation for Nushell, in place of `mise activate nu`, beside Nushell's
# configuration on each system, and an autoloaded file that uses it as `config.nu` would, so
# that `config.nu` itself is left alone.
[dotfiles.nus-activate]
source = "crates/nusage/src/activate.nu"
mode = "symlink"
variants = [
  { os = "linux", target = "~/.config/nushell/nus.nu" },
  { os = "macos", target = "~/Library/Application Support/nushell/nus.nu" },
]

[dotfiles.nus-activate-use]
source = "share/nushell/autoload/nus.nu"
mode = "symlink"
variants = [
  { os = "linux", target = "~/.config/nushell/autoload/nus.nu" },
  { os = "macos", target = "~/Library/Application Support/nushell/autoload/nus.nu" },
]

[tasks.build]
description = "Install the workspace binaries"
depends = ["//crates/...:build"]

# Registration is the user's: `plugin add` writes the plugin registry of the Nushell that
# runs this, and a session then takes the plugin with `plugin use nus`. The plugin's
# commands are the CLI's by its spec, so `nus validate` in a module is the plugin where
# it is registered and the binary where it is not.
[tasks.plugins]
description = "Register the plugin built here with the Nushell on PATH, for `plugin use` in a session"
depends = [":build"]
run = '''
for plugin in (glob ("{{ config_root }}/target/install/bin/nu_plugin_*" | path expand)) {
    plugin add $plugin
    print $"registered ($plugin | path basename): `plugin use ($plugin | path basename | str replace nu_plugin_ '')`"
}
'''

# The native Cargo projects own the checks; these select them by path.
[tasks."test:crates"]
description = "Test the workspace's discovered Cargo crates"
depends = ["./crates/...:test"]

[tasks.clippy]
depends = ["./crates/...:clippy"]

[tasks.doc]
depends = ["./crates/...:doc"]

[tasks.lint]
file = ".mise/tasks/lint.nu"
cache = { enabled = true }
sources = [
  "**/*",
  "!target/**",
  "!.cache/**",
  "!.git/**",
  "!.jj/**",
  "!.rumdl_cache/**",
  "!catalog/dist/**",
]
outputs = []

# CI runs `check` once, on Linux, and this on each platform.
[tasks."check:platform"]
description = "The checks of nusage that each platform runs"
depends = ["./crates/...:check:platform"]
