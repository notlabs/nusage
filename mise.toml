min_version = "2026.9.2"
monorepo_root = true

[monorepo]
config_roots = ["nusage", "mise"]

# The Cargo workspace is at the root, so its toolchain is: one pin for Cargo, the tasks and CI.
[tools]
rust = { version = "1.99.1", profile = "minimal", components = [
  "rustfmt",
  "clippy",
], mr_boxington = true }
mr-boxington = "1.27.0"
nu = "0.116.1"
usage = "7.1.3"
jujutsu = "0.46.0"
# The formatters `jj fix` runs and CI checks with: nufmt tracks the Nushell above.
"cargo:https://github.com/nushell/nufmt" = "tag:v0.1.6"
taplo = "0.10.0"
actionlint = "1.7.11"

# The repository's tasks run through the nusage built here, which `//nusage:build` links
# into `.bin`, not through a release. jj reads the formatters from `jj.toml` here, after
# the user's own configuration.
[env]
_.path = ["{{config_root}}/.bin"]
JJ_CONFIG = "{{ env.HOME }}/.jjconfig.toml:{{ xdg_config_home }}/jj:{{ config_root }}/jj.toml"

[tasks.lint]
description = "The workflows by actionlint, and the handwritten Nushell and the TOML as the formatters want them"
run = [
  "actionlint",
  "git ls-files '*.nu' | grep -v /expected/ | xargs nufmt --dry-run",
  "taplo fmt --check",
]

[tasks.check]
description = "The root's own checks"
depends = [":lint"]
