min_version = "2026.10.21"
monorepo_root = true

[settings]
# Native global task inputs are gated in the pinned mise version, as is the task cache.
experimental = true

[monorepo]
config_roots = ["[!.]*", "[!.]*/[!.]*", "[!.]*/[!.]*/[!.]*"]

[deps.workspace-graph]
auto = true
sources = [
  "**/mise*.toml",
  ".mise/conf.d/[!_]*.toml",
  ".mise/**/*.nu",
  "**/Cargo.toml",
  "**/go.mod",
  "**/go.sum",
  "**/*.go",
  "**/*.nu",
]
outputs = ["go.work", ".mise/conf.d/_workspace-graph.toml"]
run = "nu .mise/workspace-graph.nu"

[task_config]
# Shared configuration affects inherited tools and task behavior. Unowned paths
# (root files and .mise/) retain Mise's conservative fallback to every project.
global_inputs = ["**/mise*.toml", "**/mise.lock", ".mise/conf.d/*.toml"]
# A task that declares what it reads, and what it writes or that it writes nothing, keeps
# its result in mise's task cache.
cache = { enabled = true }

[tools]
nu = "0.116.1"
usage = "7.1.3"

# The repository's tasks run through the nus `//nusage:build` copies into `.bin`, not through
# a release.
[env]
_.path = ["{{config_root}}/.bin"]

[tasks.check]
description = "The root's own checks"
depends = [
  ":lint",
  ":check-affected",
  ":check-pr-status",
  ":check-workspace-graph",
]

[task_templates."catalog-entry-spec"]
file = "{{config_root}}/../../tasks/spec.nu"
depends = ["//nusage:build"]
env = { NUS_CATALOG_ROOT = "{{config_root}}/../..", NUS_CATALOG_ENTRY = "{{config_root | basename}}" }

[task_templates."catalog-entry-generate"]
file = "{{config_root}}/../../tasks/generate.nu"
depends = ["//nusage:build"]
env = { NUS_CATALOG_ROOT = "{{config_root}}/../..", NUS_CATALOG_ENTRY = "{{config_root | basename}}" }

[task_templates."catalog-entry-check"]
file = "{{config_root}}/../../tasks/check.nu"
depends = ["//nusage:build"]
env = { NUS_CATALOG_ROOT = "{{config_root}}/../..", NUS_CATALOG_ENTRY = "{{config_root | basename}}" }
