min_version = "2026.10.21"
monorepo_root = true

[settings]
# Native global task inputs are gated in the pinned mise version, as is the task cache.
experimental = true

[monorepo]
config_roots = [
  "nusage",
  "catalog",
  "catalog/clap",
  "catalog/cobra",
  "catalog/schemas",
  "intent",
  "mergiraf",
]

# Task config roots and inferred Cargo package roots are different. These projects own
# the checks; dependencies carry changes to the consumers that exercise them.
[monorepo.projects."custom:nusage"]
root = "nusage"

[monorepo.projects."custom:catalog"]
root = "catalog"
depends = ["custom:nusage", "custom:clap", "custom:cobra", "custom:schemas"]

[monorepo.projects."custom:clap"]
root = "catalog/clap"

[monorepo.projects."custom:cobra"]
root = "catalog/cobra"
depends = ["custom:nusage"]

[monorepo.projects."custom:schemas"]
root = "catalog/schemas"
depends = ["custom:nusage"]

[monorepo.projects."custom:intent"]
root = "intent"
depends = ["custom:nusage"]

[monorepo.projects."custom:mergiraf"]
root = "mergiraf"

[task_config]
# Cargo crates have deeper inferred roots: keep all checks for core changes, including
# future plugin crates. Shared configuration can change inherited tools and task behavior.
# Other unowned paths (root files and .mise/) also affect every project. Root checks run
# unconditionally in CI, so no catch-all root project hides that conservative fallback.
global_inputs = [
  "nusage/crates/**",
  "**/mise*.toml",
  "**/mise.lock",
  ".mise/conf.d/*.toml",
]
# A task that declares what it reads, and what it writes or that it writes nothing, keeps
# its result in mise's task cache.
cache = { enabled = true }

[tools]
nu = "0.116.1"
usage = "7.1.3"
# nufmt tracks the Nushell above.
"github:nushell/nufmt" = "0.1.6"
taplo = "0.10.0"
rumdl = "0.3.2"
"github:owenlamont/ryl" = "0.28.0"
go = "1.27.3"
jactionlint = "2.3.0"
# jactionlint checks the workflows' `run` scripts with it.
shellcheck = "0.11.0"
release-plz = "0.4.2"

# The repository's tasks run through the nus `//nusage:build` copies into `.bin`, not through
# a release.
[env]
_.path = ["{{config_root}}/.bin"]

[tasks.check]
description = "The root's own checks"
depends = [":lint", ":check-affected", ":check-pr-status"]

# The release is the commit this leaves to make: pushed to main, release.yml tags it.
[tasks.release]
description = "Bump the versions and write the changelog from the commits since the last tag"
run = "release-plz update"
