min_version = "2026.10.21"
monorepo_root = true

[settings]
# Native global task inputs are gated in the pinned mise version, as is the task cache.
experimental = true
# The cache server, Mr Boxington's mbx-cache: Cargo's compilations for mbx, task results
# for mise. Anyone may read it; only CI's pushes to main write to it. Its URL goes here and
# in `MBX_REMOTE_URL` under `[env]`, the same in both: mise does not template its settings,
# and mbx takes no remote from a repository's configuration. CI uses the server when
# `MBX_REMOTE_URL` is set and GitHub's Actions cache when it is not. mise refuses an empty
# URL, so until there is a server both lines stay commented out.
# task.cache.remote_url = "https://cache.example.com"
task.cache.remote_namespace = "notlabs/nusage/tasks"

[monorepo]
config_roots = [
  "nusage",
  "catalog",
  "catalog/clap",
  "catalog/cobra",
  "catalog/schemas",
  "intent",
  "mergiraf",
]

# Task config roots and inferred Cargo package roots are different. These projects own
# the checks; dependencies carry changes to the consumers that exercise them.
[monorepo.projects."custom:nusage"]
root = "nusage"

[monorepo.projects."custom:catalog"]
root = "catalog"
depends = ["custom:nusage", "custom:clap", "custom:cobra", "custom:schemas"]

[monorepo.projects."custom:clap"]
root = "catalog/clap"

[monorepo.projects."custom:cobra"]
root = "catalog/cobra"
depends = ["custom:nusage"]

[monorepo.projects."custom:schemas"]
root = "catalog/schemas"
depends = ["custom:nusage"]

[monorepo.projects."custom:intent"]
root = "intent"
depends = ["custom:nusage"]

[monorepo.projects."custom:mergiraf"]
root = "mergiraf"

[task_config]
# Cargo crates have deeper inferred roots: keep all checks for core changes, including
# future plugin crates. Shared configuration can change inherited tools and task behavior.
# Other unowned paths (root files and .mise/) also affect every project. Root checks run
# unconditionally in CI, so no catch-all root project hides that conservative fallback.
global_inputs = ["nusage/crates/**", "**/mise*.toml", "**/mise.lock"]

# The Cargo workspace is at the root, so its toolchain is: one pin for Cargo, the tasks and CI.
[tools]
rust = { version = "1.99.1", profile = "minimal", components = [
  "rustfmt",
  "clippy",
], mr_boxington = true }
mr-boxington = "1.27.0"
nu = "0.116.1"
usage = "7.1.3"
jujutsu = "0.46.0"
# The formatters `jj fix` runs and CI checks with: nufmt tracks the Nushell above.
"github:nushell/nufmt" = "0.1.6"
taplo = "0.10.0"
jactionlint = "2.3.0"
# jactionlint checks the workflows' `run` scripts with it.
shellcheck = "0.11.0"
release-plz = "0.4.2"

# The repository's tasks run through the nus built here, which `//nusage:build` links
# into `.bin`, not through a release; the root's own are the files under `.mise/tasks`. jj
# reads the formatters from `jj.toml` here, after
# the user's own configuration files in the order jj itself reads them, from the home and
# configuration directories of the platform; a path that does not exist is passed over.
[env]
_.path = ["{{config_root}}/.bin"]
JJ_CONFIG = '{% if os() == "windows" %}{{ env.USERPROFILE }}\.jjconfig.toml;{{ env.APPDATA }}\jj\config.toml;{{ env.APPDATA }}\jj\conf.d;{{ config_root }}\jj.toml{% else %}{{ env.HOME }}/.jjconfig.toml:{{ xdg_config_home }}/jj/config.toml:{{ xdg_config_home }}/jj/conf.d:{{ config_root }}/jj.toml{% endif %}'
# The cache server, as `[settings]` names it for mise.
# MBX_REMOTE_URL = "https://cache.example.com"
MBX_REMOTE_NAMESPACE = "notlabs/nusage/builds"

[tasks.check]
description = "The root's own checks"
depends = [":lint", ":check-affected"]

# The release is the commit this leaves to make: pushed to main, release.yml tags it.
[tasks.release]
description = "Bump the versions and write the changelog from the commits since the last tag"
run = "release-plz update"
