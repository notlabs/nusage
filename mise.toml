min_version = "2026.10.21"
monorepo_root = true

[_.nusage.project]
depends_add = ["custom:catalog", "custom:catalog/lib/gh"]

[settings]
# Task result caching uses Mise's experimental features.
experimental = true

[monorepo]
config_roots = ["[!.]*", "[!.]*/[!.]*", "[!.]*/[!.]*/[!.]*"]

[deps.workspace-graph]
auto = true
sources = [
  ".miserc.toml",
  "**/mise*.toml",
  "**/*.tasks.toml",
  "**/.mise/conf.d/[!_]*.toml",
  ".mise/conf.d/[!_]*.toml",
  ".mise/**/*.nu",
  ".mise/**/*.tasks.toml",
  "**/Cargo.toml",
  "**/go.mod",
  "**/go.sum",
  "**/*.go",
  "**/*.nu",
]
outputs = ["go.work", ".mise/conf.d/_workspace-graph.toml"]
run = "nu .mise/workspace-graph.nu"

[task_config]
includes = [".mise/tasks", ".mise/lib/nu.tasks.toml"]
# A task that declares what it reads, and what it writes or that it writes nothing, keeps
# its result in mise's task cache.
cache = { enabled = true }

[tools]
nu = "0.116.1"
usage = "7.1.3"

# The released public module bootstraps the catalog that produces its next version.
[tools."http:catalog-bootstrap"]
version = "0.1.0"
url = "https://github.com/notlabs/nusage/releases/download/catalog/v0.1.0/nusage-catalog-0.1.0.tar.gz"
strip_components = 1
bin_path = "lib"

# The repository's tasks run through the nus `//nusage:build` copies into `.bin`, not through
# a release.
[env]
# Keep managed target links inside the discovery boundary; the object store remains shared.
MBX_TARGET_ROOT = "{{config_root}}/.cache/mbx-targets"
# Carry the exclusion into nested Mise invocations during graph preparation.
MISE_IGNORED_CONFIG_PATHS = "{{env.MBX_TARGET_ROOT}}"
_.path = ["{{config_root}}/.bin"]
NU_LIB_DIRS = { value = "{{ tools['catalog-bootstrap'].path }}/lib", tools = true }

[tasks.check]
description = "The root's own checks"
depends = [":lint", ":check-pr-status", ":test"]

[tools."http:nutest"]
version = "1.2.0"
url = "https://github.com/vyadh/nutest/releases/download/v1.2.0/nutest-1.2.0.zip"
strip_components = 1
bin_path = "."

[tasks.test]
dir = ".mise"
sources = [
  "../mise.toml",
  "../.miserc.toml",
  "../nusage/mise.toml",
  "../nusage/crates/nusage/mise.toml",
]
outputs = []
cache = { enabled = true, command_inputs = [
  "mise --version",
], env = [
  "GOOS",
  "GOARCH",
  "GOFLAGS",
] }
