# The TypeSafe AI API, as its official SDKs send it: `typesafe-sdk` 0.7.5 on PyPI, whose wire
# models are generated from https://api.typesafe.ai/openapi.json, and `@typesafe-ai/sdk`
# 0.7.0 on npm. The schemas are those models, with their descriptions; the paths, methods,
# header and authentication are what the SDKs' transports send. Image assets travel as
# `multipart/form-data`, a JSON `request` part followed by one part per image, which the
# SDKs build and this document describes but the wrapper does not send: it sends JSON.
openapi: 3.1.0
info:
  title: TypeSafe AI
  version: "1"
  summary: Typed decisions about content, with calibrated probabilities
  description: |
    A System One model answers named questions about a piece of content, the `state`, and
    returns one typed answer per question rather than text: a yes/no probability (`noul`), a
    selection among named choices with their probabilities (`choice`), an expected score
    against an ordered rubric (`score`), or a located box in an image (`box`). The first System
    One model is Jev, reached as `jev-latest`; `jev-preview` answers `box` questions.

    Authenticate with an API key as a bearer token. Requests are JSON; the request body may be
    sent compressed with `Content-Encoding: zstd`. An unsuccessful response carries its reason
    in a JSON body, as `error`, `message` or `detail`, and every response carries
    `x-typesafe-request-id`. A rate-limited response says how long to wait in `retry-after`
    or `retry-after-ms`.
servers:
  - url: https://api.typesafe.ai
security:
  - bearerAuth: []
paths:
  /v1/models:
    get:
      operationId: listModels
      summary: List the models available to the account
      description: The names and aliases a request's `model` accepts, with what each is.
      responses:
        "200":
          description: The available models.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelMetadataList"
        "401":
          description: The API key is missing or invalid.
  /v1/systemone:
    post:
      operationId: systemOne
      summary: Answer named questions about content
      description: |
        Evaluates every question in `questions` against `state` with the model named, and
        returns an answer per question under the question's name, typed as the question is.
        A choice question needs at least one choice, a score question at least one rubric
        level, and a yes/no question either instructions or a described outcome.
      parameters:
        - in: header
          name: TypeSafe-Danger-Zone-Images
          description: |
            Opt in to image assets, which are experimental: `true` to send PNG or JPEG images in
            `assets`, as base64 data or multipart parts.
          schema:
            type: boolean
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SystemOneRequest"
      responses:
        "200":
          description: One answer per question.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemOneResponse"
        "400":
          description: The request is invalid, such as an image in a format other than PNG or JPEG.
        "401":
          description: The API key is missing or invalid.
        "422":
          description: The request failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
        "429":
          description: The rate limit was exceeded; `retry-after` or `retry-after-ms` says how long to wait.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: The account's API key, `TYPESAFE_API_KEY` in the SDKs' environment.
  schemas:
    Content:
      description: Text, a JSON object or a JSON array; a string may hold an asset's reference.
      anyOf:
        - type: string
        - type: object
        - type: array
    OptionalContent:
      description: Content, or null to leave it undescribed.
      anyOf:
        - type: string
        - type: object
        - type: array
        - type: "null"
    Format:
      type: string
      enum: [png, jpg, jpeg]
    Asset:
      type: object
      title: Asset
      properties:
        type:
          type: string
          const: image
          description: Identifies an image asset.
          title: Type
        format:
          $ref: "#/components/schemas/Format"
          description: The image format, required with data_base64. The actual format is detected from the bytes.
          title: Format
        data_base64:
          type: string
          description: Base64-encoded image data.
          title: Data Base64
        part:
          type: string
          description: In a multipart request, the name of the image part this asset uses. With part, data_base64 is ignored.
          title: Part
    NoulCriteria:
      type: object
      title: NoulCriteria
      properties:
        "true":
          $ref: "#/components/schemas/OptionalContent"
          description: What counts as a yes answer.
          title: "True"
        "false":
          $ref: "#/components/schemas/OptionalContent"
          description: What counts as a no answer.
          title: "False"
    NoulQuestion:
      type: object
      title: NoulQuestion
      required: [type]
      properties:
        type:
          type: string
          const: noul
          description: Identifies a yes/no question or statement.
          title: Type
        instructions:
          $ref: "#/components/schemas/OptionalContent"
          description: The yes/no question or statement to evaluate.
          title: Instructions
        criteria:
          anyOf:
            - $ref: "#/components/schemas/NoulCriteria"
            - type: "null"
          description: Criteria clarifying what counts as a yes or no answer.
    ChoiceQuestion:
      type: object
      title: ChoiceQuestion
      required: [type, criteria]
      properties:
        type:
          type: string
          const: choice
          description: Identifies a question that selects one of the choices in criteria.
          title: Type
        instructions:
          $ref: "#/components/schemas/OptionalContent"
          description: What the model should decide when choosing an option.
          title: Instructions
        criteria:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/OptionalContent"
          description: Choice names and descriptions of when each applies. A choice without a description is interpreted by its name alone.
          title: Criteria
    ScoreQuestion:
      type: object
      title: ScoreQuestion
      required: [type, criteria]
      properties:
        type:
          type: string
          const: score
          description: Identifies a question that rates the content using the levels in criteria.
          title: Type
        instructions:
          $ref: "#/components/schemas/OptionalContent"
          description: What the model should rate.
          title: Instructions
        criteria:
          type: array
          items:
            $ref: "#/components/schemas/Content"
          minItems: 1
          description: Ordered descriptions of the score levels. Each description's position determines its score, starting at zero.
          title: Criteria
    BoxQuestion:
      type: object
      title: BoxQuestion
      required: [type]
      properties:
        type:
          type: string
          const: box
          description: Identifies a box question.
          title: Type
        instructions:
          $ref: "#/components/schemas/OptionalContent"
          description: What to locate in the image.
          title: Instructions
    Question:
      description: A question about the supplied content.
      oneOf:
        - $ref: "#/components/schemas/NoulQuestion"
        - $ref: "#/components/schemas/ChoiceQuestion"
        - $ref: "#/components/schemas/ScoreQuestion"
        - $ref: "#/components/schemas/BoxQuestion"
      discriminator:
        propertyName: type
    SystemOneRequest:
      type: object
      title: SystemOneRequest
      required: [model, state, questions]
      properties:
        model:
          type: string
          description: Name or alias of the model to use. Available names are returned by GET /v1/models.
          title: Model
        state:
          $ref: "#/components/schemas/Content"
          description: The content all questions in this request refer to.
          title: State
        questions:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Question"
          minProperties: 1
          description: Questions to ask about the content, each with a name you choose. The response uses those names to identify the answers.
          title: Questions
        assets:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Asset"
          minProperties: 1
          description: Media assets keyed by an opaque placeholder (recommend a per-image UUID). Each placeholder, wherever it appears as or inside a string in state, question instructions, or criteria, is replaced with the asset. Image assets require a vision-language model.
          title: Assets
    NoulAnswer:
      type: object
      title: NoulAnswer
      required: [type, noul]
      properties:
        type:
          type: string
          const: noul
          description: Identifies a yes/no answer.
          title: Type
        noul:
          type: number
          description: Probability of a yes answer or a true statement, from 0 to 1. Values near 1 favor yes or true, values near 0 favor no or false, and values near 0.5 indicate uncertainty.
          title: Noul
    ChoiceAnswer:
      type: object
      title: ChoiceAnswer
      required: [type, choice, confidence, probabilities]
      properties:
        type:
          type: string
          const: choice
          description: Identifies a selection from the requested choices.
          title: Type
        choice:
          type: string
          description: The name of the choice with the highest probability among the question's criteria.
          title: Choice
        confidence:
          type: number
          description: Confidence in the selected choice, from 0 to 1. Higher values indicate greater certainty; use lower values to flag uncertain selections for review.
          title: Confidence
        probabilities:
          type: object
          additionalProperties:
            type: number
          description: Probability of each choice in criteria, keyed by choice name, from 0 to 1. Shows how likely the alternatives are; values sum to approximately 1.
          title: Probabilities
    ScoreAnswer:
      type: object
      title: ScoreAnswer
      required: [type, score, confidence, legend, probabilities]
      properties:
        type:
          type: string
          const: score
          description: Identifies a rating against the requested score levels.
          title: Type
        score:
          type: number
          description: "Expected score: the probability-weighted average of the rubric levels. May fall between integer levels."
          title: Score
        confidence:
          type: number
          description: Confidence in the score, from 0 to 1. Higher values indicate greater certainty; use lower values to flag uncertain ratings for review.
          title: Confidence
        legend:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Content"
          description: The requested criteria mapped to their score levels, so you can interpret the score.
          title: Legend
        probabilities:
          type: object
          additionalProperties:
            type: number
          description: Probability of each score level, from 0 to 1, using the same keys as legend. Shows how likely the alternatives are; values sum to approximately 1.
          title: Probabilities
    BoxCoordinates:
      type: object
      title: BoxCoordinates
      required: [top, bottom, left, right]
      properties:
        top:
          type: number
          description: Top edge of the box, as a fraction of image height from the top (0-1).
          title: Top
        bottom:
          type: number
          description: Bottom edge of the box, as a fraction of image height from the top (0-1).
          title: Bottom
        left:
          type: number
          description: Left edge of the box, as a fraction of image width from the left (0-1).
          title: Left
        right:
          type: number
          description: Right edge of the box, as a fraction of image width from the left (0-1).
          title: Right
    BoxAnswer:
      type: object
      title: BoxAnswer
      required: [type, box, confidence]
      properties:
        type:
          type: string
          const: box
          description: Identifies a box answer.
          title: Type
        box:
          $ref: "#/components/schemas/BoxCoordinates"
          description: The box's edges as fractions of image height and width, from 0 to 1. Each coordinate is the expected value of its edge's predicted position.
        confidence:
          type: [number, "null"]
          description: Confidence for the given box, from 0 to 1, with 1 being more confident. Null when the model does not provide confidence.
          title: Confidence
    Answer:
      description: An answer whose type matches the corresponding question.
      oneOf:
        - $ref: "#/components/schemas/NoulAnswer"
        - $ref: "#/components/schemas/ChoiceAnswer"
        - $ref: "#/components/schemas/ScoreAnswer"
        - $ref: "#/components/schemas/BoxAnswer"
      discriminator:
        propertyName: type
    Usage:
      type: object
      title: Usage
      required: [input_tokens, output_tokens]
      properties:
        input_tokens:
          type: integer
          description: Number of billable input tokens used to evaluate the request.
          title: Input Tokens
        output_tokens:
          type: integer
          description: Number of output tokens used to answer the questions. Output tokens are currently free of charge.
          title: Output Tokens
    SystemOneResponse:
      type: object
      title: SystemOneResponse
      required: [model, answers, usage]
      properties:
        model:
          type: string
          description: Name of the model that answered the questions. May differ from the alias supplied in the request.
          title: Model
        answers:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Answer"
          minProperties: 1
          description: Answers keyed by the question names supplied in the request. Each answer's type matches its question's type.
          title: Answers
        usage:
          $ref: "#/components/schemas/Usage"
          description: Input and output token counts for this evaluation.
    ModelMetadata:
      type: object
      title: ModelMetadata
      required: [name, description, release_date]
      properties:
        name:
          type: string
          description: Model name or alias accepted by the request's model field.
          title: Name
        description:
          type: string
          description: Human-readable description of the model and its capabilities.
          title: Description
        release_date:
          type: string
          description: Model release date, formatted as YYYY-MM-DD.
          title: Release Date
    ModelMetadataList:
      type: object
      title: ModelMetadataList
      required: [models]
      properties:
        models:
          type: array
          items:
            $ref: "#/components/schemas/ModelMetadata"
          description: Available models and aliases. Use a model's name in POST /v1/systemone requests.
          title: Models
    ValidationError:
      type: object
      title: ValidationError
      required: [loc, msg, type]
      properties:
        loc:
          type: array
          items:
            anyOf:
              - type: string
              - type: integer
          description: "Path to the invalid value: the request location followed by field names and array indices."
          title: Location
        msg:
          type: string
          description: Human-readable explanation of the validation failure.
          title: Message
        type:
          type: string
          description: Machine-readable validation error code.
          title: Error Type
        input:
          description: The input value that failed validation.
          title: Input
        ctx:
          type: [object, "null"]
          description: Additional context used to explain the validation failure.
          title: Context
    HTTPValidationError:
      type: object
      title: HTTPValidationError
      properties:
        detail:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/ValidationError"
          description: Validation errors describing which request values are missing or invalid.
          title: Detail
