[_.nusage.project]
depends_add = ["custom:catalog", "custom:catalog/cobra"]

[_.nusage.catalog]
spec = { run = "mise run //catalog/cobra:compose", probe = "version" }
version = "0.2.0"
tool = "docker-compose"

[tools]
docker-compose = "5.6.1"

[tasks.spec]
extends = "catalog-entry-spec"

[tasks.generate]
extends = "catalog-entry-generate"

[tasks.check]
extends = "catalog-entry-check"

[tasks."check:platform"]
extends = "catalog-entry-platform-check"
