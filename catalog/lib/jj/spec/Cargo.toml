# The extractor of jj's spec: jj-cli is the library the `jj` binary is built from, and builds the
# command the binary parses, so linking it at the version of the jj on PATH reads that binary's
# interface with nothing patched. `mise run //catalog:spec jj` sets the version and runs it.
[workspace]

[package]
name = "jj-spec"
version = "0.0.0"
edition = "2024"
publish = false

# Read by clap/spec.nu: the binary the spec describes, and the crate whose version it follows.
[package.metadata.clap-spec]
bin = "jj"
crate = "jj-cli"

[dependencies]
clap-spec = { path = "../../../clap" }
# With its default features, as the released binary is built: `git` adds `jj git`.
jj-cli = "=0.46.0"
