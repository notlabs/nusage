# These tasks belong to the entry that includes this file. The `nus` they run is the root's
# `nus` provider's build, on PATH.
[spec]
file = "../../mise-tasks/spec.nu"
env.NUS_CATALOG_ROOT = "{{config_root}}/.."

[generate]
file = "../../mise-tasks/generate.nu"
env.NUS_CATALOG_ROOT = "{{config_root}}/.."

[check]
file = "../../mise-tasks/check.nu"
depends = ["^check"]
env.NUS_CATALOG_ROOT = "{{config_root}}/.."

["check:platform"]
file = "../../mise-tasks/check.nu"
depends = ["^check:platform"]
env.NUS_CATALOG_ROOT = "{{config_root}}/.."
