[_.nusage.catalog]
spec = { openapi = "openapi.yaml" }

[task_config]
cache = { enabled = true }

[_.nusage.project]
depends_add = ["cargo:openapi-usage"]

[tasks.spec]
file = "../../mise-tasks/spec.nu"
env.NUS_CATALOG_ROOT = "{{config_root}}/../.."

[tasks.generate]
file = "../../mise-tasks/generate.nu"
env.NUS_CATALOG_ROOT = "{{config_root}}/../.."

[tasks.check]
sources = [
  "**/*",
  "../../mise-tasks/**/*.nu",
  "../../lib/**/*.nu",
  "../../../target/install/bin/nus",
]
outputs = []
file = "../../mise-tasks/check.nu"
env.NUS_CATALOG_ROOT = "{{config_root}}/../.."

[tasks."check:platform"]
sources = [
  "**/*",
  "../../mise-tasks/**/*.nu",
  "../../lib/**/*.nu",
  "../../../target/install/bin/nus",
]
outputs = []
file = "../../mise-tasks/check.nu"
env.NUS_CATALOG_ROOT = "{{config_root}}/../.."
