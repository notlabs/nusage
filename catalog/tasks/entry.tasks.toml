# These tasks belong to the entry that includes this file.
[spec]
file = "../../tasks/spec.nu"
depends = ["^build"]
env.NUS_CATALOG_ROOT = "{{config_root}}/.."

[generate]
file = "../../tasks/generate.nu"
depends = ["^build"]
env.NUS_CATALOG_ROOT = "{{config_root}}/.."

[check]
file = "../../tasks/check.nu"
depends = ["^build", "^check"]
env.NUS_CATALOG_ROOT = "{{config_root}}/.."

["check:platform"]
file = "../../tasks/check.nu"
depends = ["^build", "^check:platform"]
env.NUS_CATALOG_ROOT = "{{config_root}}/.."
