# The crate every extractor links, in its own Cargo workspace; `spec.nu` builds and runs an
# extractor for the binary on PATH. A package under `../lib/` holds its extractor, and the
# catalog's `spec` task calls `spec.nu` for an entry whose `spec` names it, as jj's does.
[tasks.test]
description = "The crate's tests"
run = "cargo test --locked"

[tasks.clippy]
description = "Clippy for every crate target on this platform"
run = "cargo clippy --quiet --all-targets --locked -- -D warnings"

[tasks.check]
description = "Every check of the crate"
depends = [":test", ":clippy"]

[tasks."check:platform"]
description = "The crate's checks on this platform"
depends = [":check"]
