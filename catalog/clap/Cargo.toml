# Its own workspace, apart from nusage's: nusage reads specs and never links a binary's crate,
# so neither usage's clap conversion nor an extractor's dependencies ride along in its build.
[workspace]

[package]
name = "clap-spec"
description = "The usage spec of a binary whose interface is the clap command its crate builds"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/notlabs/nusage"
publish = false

[dependencies]
# The version nusage reads specs with, so that what is written here is what it reads.
usage = { package = "usage-lib", version = "7.1.3", default-features = false, features = [
  "clap",
] }
# `string`: the version is the extractor's argument, not a `&'static str`.
clap = { version = "4.6", default-features = false, features = [
  "std",
  "string",
] }
