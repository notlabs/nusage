# The formatters `jj.toml` gives `jj fix`, and the linters the lint runs beside them.
[tools]
# nufmt tracks the Nushell `mise.toml` pins.
"github:nushell/nufmt" = "0.1.6"
taplo = "0.10.0"
rumdl = "0.3.2"
"github:owenlamont/ryl" = "0.28.0"
# gofmt's, and the toolchain the Cobra extractors build with.
go = "1.27.3"
jactionlint = "2.3.0"
# jactionlint checks the workflows' `run` scripts with it.
shellcheck = "0.11.0"
