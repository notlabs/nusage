# Build artifacts are not repository TOML, including targets reached through MBX links.
exclude = ["**/target/**", ".cache/**"]

# The schema each kind of TOML file is held to, as SchemaStore lists it; the fixtures that
# show mise refusing a config stay unvalidated.
[[rule]]
include = ["**/Cargo.toml"]
schema.url = "https://www.schemastore.org/cargo.json"

[[rule]]
include = [
  "**/mise.toml",
  "**/mise.*.toml",
  "**/conf.d/**/*.toml",
  ".mise/config*.toml",
]
exclude = ["**/schema-fixtures/**"]
schema.url = "https://mise.jdx.dev/schema/mise.json"

[[rule]]
include = ["**/.miserc*.toml"]
schema.url = "https://raw.githubusercontent.com/jdx/mise/v2026.10.21/schema/miserc.json"

[[rule]]
include = [".rumdl.toml"]
schema.url = "https://www.schemastore.org/rumdl.json"

[[rule]]
include = [".ryl.toml"]
schema.url = "https://www.schemastore.org/ryl.json"

[[rule]]
include = [".taplo.toml"]
schema.url = "https://www.schemastore.org/taplo.json"

[[rule]]
include = ["release-plz.toml"]
schema.url = "https://raw.githubusercontent.com/release-plz/release-plz/main/.schema/latest.json"
