# The crate every extractor links, in its own Cargo workspace; `spec.nu` builds and runs an
# extractor for the binary on PATH. A binary's own directory holds its extractor and calls
# `spec.nu` from its `spec` task, as `//jj:spec` does.
[tasks.test]
description = "The crate's tests"
run = "cargo test --locked"

[tasks.lint]
description = "Formatting and clippy, as CI checks them"
run = [
  "cargo fmt --check",
  "cargo clippy --all-targets --locked -- -D warnings",
]

[tasks.check]
description = "The crate's tests, formatting and clippy"
depends = [":test", ":lint"]
