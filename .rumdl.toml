# Markdown as `jj fix` formats it and the lint checks it: prose wrapped at 95 columns, as the
# repository writes it, and a paragraph that runs past them rewrapped; tables and code keep
# their width. release-plz writes the changelog.
[global]
exclude = ["CHANGELOG.md"]

[MD013]
line-length = 95
tables = false
code-blocks = false
reflow = true
