# The released nusage, with what it runs: `nus nu` and the language server start `nu`, and
# a generated module's completions run `usage`. nusage's releases are this repository's
# `v<version>` tags; the catalog's packages and task catalog have tags of their own under
# `catalog/`. A project that uses the catalog's packages includes `nus.toml` beside this.
[tools]
"github:notlabs/nusage" = { version = "latest", version_prefix = "v" }
nu = "0.116.1"
usage = "7.1.3"
