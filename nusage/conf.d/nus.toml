# nusage for a project that includes this file beside its own tools: nusage, the catalog's
# packages it uses, and the tools those wrap, at the versions the packages were generated
# from. nus reads both variables; `nu` is `nus nu`.
[env]
NUS_MODULES = { value = "{ {%- for name, tool in tools -%}{%- if 'packslip:github.com/notlabs/nusage/catalog/' in name -%}{%- set module = name | split(pat='/') | last -%}'{{ module }}': '{{ tool.path }}/{{ module }}', {% endif -%}{%- endfor -%} }", tools = true }
NUS_TOOLS = { value = "{ {%- for name, tool in tools -%}'{{ name }}': '{{ tool.version }}', {% endfor -%} }", tools = true }

[wrappers.nu]
command = "nus"
args = ["nu"]
