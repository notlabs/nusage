[tools]
# usage's source, for its argv corpus, which the tests pose to the interpreter's parser.
"http:usage-source" = { version = "7.1.3", url = "https://github.com/jdx/usage/archive/refs/tags/v{% raw %}{{ version }}{% endraw %}.tar.gz", strip_components = 1, bin_path = "corpus" }

# The released nusage for this user, pinned in a fragment of the global mise config that
# `mise dot apply` links into place.
[dotfiles]
"~/.config/mise/conf.d/nusage.toml" = { source = "conf.d/nusage.toml", mode = "symlink" }

[task_config]
shell = "nu -c"

# The build, copied where the root's `[env] _.path` looks for it, from the path Cargo
# reports: a build cache may keep the target directory elsewhere, and Cargo rewrites the
# binary there whenever another of its commands relinks it, under a task that is running it.
[tasks.build]
description = "Build the workspace and copy nusage into the repository's bin directory"
sources = ["../Cargo.toml", "../Cargo.lock", "crates/**/*"]
outputs = ["../.bin/nusage"]
run = '''
let built = ^cargo build --workspace --locked --message-format json-render-diagnostics
  | lines
  | where ($it | str starts-with "{")
  | each { from json }
  | where reason == compiler-artifact and executable != null and target.name == nusage
  | get 0.executable
let bin = "{{ config_root }}/../.bin" | path expand
let copy = $bin | path join nusage
mkdir $bin
if ($copy | path type) == symlink {
    rm $copy
}
if not ($copy | path exists) or (open --raw $built | hash sha256) != (open --raw $copy | hash sha256) {
    cp $built $copy
}
'''

# After the build: both write the target directory's `nusage`, and the corpus test runs it.
[tasks.test]
description = "Rust tests: every fixture generating its expected module byte for byte, and usage's corpus through the parser"
depends = [":build"]
env = { NUSAGE_CORPUS = "{{ tools['usage-source'].path }}/corpus" }
run = "cargo test --workspace --locked"

[tasks.lint]
description = "Formatting and clippy, as CI checks them"
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets --locked -- -D warnings",
]

[tasks.verify-fixtures]
description = "Run every fixture through its entrypoints, check completions and parsed signatures"
depends = [":build"]
file = "fixtures/verify.nu"

[tasks.check]
description = "Everything: tests, the fixture harness against nu, formatting and clippy"
depends = [":test", ":verify-fixtures", ":lint"]
