[_.nusage.project]
depends_add = ["custom:nusage"]

[task_config]
cache = { enabled = true }

[tasks.check]
description = "Hold the intent's files to their schemas and its checked claims to nusage as it is"
depends = ["^build"]
sources = ["**/*"]
outputs = []
file = "check.nu"

[tasks.claims]
description = "The intent's claims, as a table"
depends = ["^build"]
sources = ["**/*"]
outputs = []
file = "claims.nu"

[tasks."check:platform"]
description = "Hold the checked claims to nusage on this platform"
depends = [":check"]
