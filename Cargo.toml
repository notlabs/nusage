[workspace]
resolver = "3"
members = ["nusage/crates/*"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/notlabs/nusage"

[workspace.dependencies]
nusage = { path = "nusage/crates/nusage" }
nusage-spec = { path = "nusage/crates/nusage-spec" }
nusage-plugin = { path = "nusage/crates/nusage-plugin" }
nusage-model = { path = "nusage/crates/nusage-model" }
nusage-nu = { path = "nusage/crates/nusage-nu" }
nushell-schema = { path = "nusage/crates/nushell-schema" }
openapi-usage = { path = "nusage/crates/openapi-usage" }
# `cli-help` renders the help page usage's parser returns for `--help`, which the
# interpreter prints.
usage = { package = "usage-lib", version = "7.1.3", default-features = false, features = [
  "cli-help",
] }
usage-rs = "7.1.3"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
indexmap = "2"
# Nushell's own crates write literals, quote words and parse the output back in tests. Their
# version is the Nushell `mise.toml` pins. `nuon` pulls `nu-engine` without its `os` feature,
# and `nu-engine` only compiles when `nu-protocol` agrees, so the direct dependencies leave
# `os` off too; `nu-command` turns it on everywhere for the tests that need it.
nuon = "0.116.1"
# Output schemas, and the corpus test's vectors. A schema's properties keep their order.
jsonschema = { version = "0.60", default-features = false }
serde_json = { version = "1", features = ["preserve_order"] }
nu-protocol = { version = "0.116.1", default-features = false }
nu-parser = "0.116.1"
nu-engine = "0.116.1"
nu-cmd-lang = "0.116.1"
nu-command = "0.116.1"
nu-utils = { version = "0.116.1", default-features = false }
# The plugins: the protocol, and the harness that runs a plugin in process for its tests.
nu-plugin = "0.116.1"
nu-plugin-test-support = "0.116.1"
# The printer's templates. 0.20 is the first release whose `quote!` sees line breaks on stable.
genco = "0.20"
# Snapshots of what a transformation writes, reviewed with `cargo insta`.
insta = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
