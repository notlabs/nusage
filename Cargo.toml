[workspace]
resolver = "2"
members = ["crates/nusage-spec", "crates/nusage-model", "crates/nusage-nu", "crates/nusage"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/notlabs/nusage"

[workspace.dependencies]
nusage-spec = { path = "crates/nusage-spec" }
nusage-model = { path = "crates/nusage-model" }
nusage-nu = { path = "crates/nusage-nu" }
usage = { package = "usage-lib", version = "7.1.3", default-features = false }
usage-rs = "7.1.3"
thiserror = "2"
indexmap = "2"
