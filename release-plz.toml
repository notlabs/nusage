# The crates share the workspace version and are not published; a release is the tag and
# the GitHub release that `nusage` gets, which release.yml attaches the binaries to.
[workspace]
publish = false
git_tag_enable = false
git_release_enable = false
changelog_update = false
release_always = false

[[package]]
name = "nusage"
changelog_update = true
changelog_path = "CHANGELOG.md"
git_tag_enable = true
git_tag_name = "v{{ version }}"
git_release_enable = true
git_release_name = "v{{ version }}"
