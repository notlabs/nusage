[tasks.spec]
description = "Export the spec of the mise on PATH, left untouched when it has not changed"
depends = ["//nusage:build"]
file = "spec.nu"

[tasks.generate]
description = "Generate the module from the spec and the overlays here"
depends = [":spec"]
sources = ["generated/mise.usage.kdl", "*.kdl", "../.bin/nusage"]
outputs = ["generated/mise.json.kdl", "generated/mise.nu"]
file = "generate.nu"

[tasks.install]
description = "Generate the module and have every new interactive Nushell session load it"
depends = [":generate"]
file = "install.nu"

[tasks.check]
description = "Hold the module to mise's spec and drive mise through it"
depends = [":generate", ":check-schemas"]
file = "check.nu"

[tasks.check-schemas]
description = "Validate raw mise output against the reviewed schemas and fixture assertions"
depends = ["//nusage:build"]
file = "check-schemas.nu"
